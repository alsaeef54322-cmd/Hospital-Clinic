<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="shortcut icon" href="/img/Page 4 _ Health Vectors - Download Free High-Quality Vectors _ Magnific (formerly Freepik).jpeg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/normaliza.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div class="login-container">
        
        <!-- القسم الترحيبي (الجانب الأيسر في الصورة) -->
        <div class="welcome-section">
            <div class="overlay"></div>
            
            <div class="welcome-content">
                <!-- اللوجو -->
                 <div class="logo">
                    <i class="fa-solid fa-heart-pulse logo-icon"></i>
                    <div class="logo-text">
                        <h1> Care Plus</h1>
                    </div>
                </div>

                <!-- النصوص الترحيبية -->
                <div class="hero-text">
                    <h1>أهلاً بك في<br><span>عيادة كير بلس</span></h1>
                    <p class="subtitle">رعايتك الصحية .. أولويتنا</p>
                    <p class="description">نقدم لك أفضل الخدمات الطبية بأحدث الأجهزة وبفريق من الأطباء المتخصصين.</p>
                </div>

                <!-- الميزات الأربع -->
                <div class="features-grid">
                    <div  class="feature-card">
                        <img src="/img/clinic_ui_assets/06_devices_icon.png" alt="">
                    
                    </div>
                    <div  class="feature-card">
                        <img src="/img/clinic_ui_assets/05_care_icon.png" alt="">
                    </div>
                    <div class="feature-card">
                        <img src="/img/clinic_ui_assets/04_clock_icon.png" alt="" srcset="">
                    </div>
                    <div  class="feature-card">
                        <img src="/img/clinic_ui_assets/03_expert_doctors_icon.png" alt="" srcset="">
                    </div>
                </div>

                <!-- الشعار السفلـي -->
                <div class="tagline">
                    <i class="fa-solid fa-hand-holding-heart"></i>
                    <span>صحتك تهمنا</span>
                </div>
            </div>
        </div>
  



        
        <!-- قسم نموذج تسجيل الدخول (الجانب الأيمن في الصورة) -->
        <div class="form-section">
            <!-- اختيار اللغة -->
            <div class="lang-selector">
                <i class="fa-solid fa-globe"></i>
                <select>
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="form-wrapper">
                <!-- أيقونة المستخدم -->
                <div class="user-avatar">
                    <img src="/img/clinic_ui_assets/07_login_user_icon.png" alt="">
                </div>

                <h2>تسجيل الدخول</h2>
                <p class="form-subtitle">قم بتسجيل الدخول للوصول إلى خدمات العيادة</p>

                <form>
                    <!-- حقل البريد/الهاتف -->
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="text" placeholder="البريد الإلكتروني أو رقم الهاتف" required>
                    </div>

                    <!-- حقل كلمة المرور -->
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" placeholder="كلمة المرور" required>
                        <i class="fa-regular fa-eye-slash toggle-password"></i>
                    </div>

                    <!-- خيارات تذكرني ونسيت كلمة المرور -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>تذكرني</span>
                        </label>
                        <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
                    </div>

                    <!-- زر تسجيل الدخول -->
                    <button type="submit" class="submit-btn">
                        تسجيل الدخول <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </form>

                <!-- الفاصل -->
                <div class="divider">
                    <span>أو تسجيل الدخول باستخدام</span>
                </div>

                <!-- أزرار التواصل الاجتماعي -->
                <div class="social-login">
                    <button class="social-btn google-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        <span>Google</span>
                    </button>
                    <button class="social-btn apple-btn">
                        <i class="fa-brands fa-apple"></i>
                        <span>Apple</span>
                    </button>
                </div>

                <!-- صندوق إنشاء حساب -->
                <div class="register-box">
                    <span>ليس لديك حساب؟</span>
                    <a href="#"><i class="fa-solid fa-user-plus"></i> إنشاء حساب جديد</a>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
